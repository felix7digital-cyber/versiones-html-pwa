name: Build APK

on:
  workflow_dispatch:
    inputs:
      project:
        description: 'Nombre de la carpeta del proyecto en apps/'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles(format('apps/{0}/**/*.gradle*', inputs.project)) }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Setup Gradle wrapper
        working-directory: apps/${{ inputs.project }}
        run: |
          chmod +x gradlew
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.9 || true
          fi

      - name: Build APK
        working-directory: apps/${{ inputs.project }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Read version
        id: ver
        working-directory: apps/${{ inputs.project }}
        run: |
          VERSION=$(grep -oP 'versionName = "\\K[^"]+' app/build.gradle.kts || echo "1.0.0")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.project }}-v${{ steps.ver.outputs.version }}-${{ github.run_number }}
          name: "${{ inputs.project }} v${{ steps.ver.outputs.version }} (build ${{ github.run_number }})"
          files: apps/${{ inputs.project }}/app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.project }}-apk
          path: apps/${{ inputs.project }}/app/build/outputs/apk/debug/app-debug.apk